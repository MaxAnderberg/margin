# Builds Margin for macOS, Windows and Linux.
#
# - Pull requests (and manual runs): build every platform and upload the
#   installers as workflow artifacts, so each change is known to build.
# - Releases made by release-please (see release-please.yml) call this
#   workflow with the new tag, and the installers are attached to that release.
# - Tags pushed by hand (v0.2.0): build every platform and attach the
#   installers to a draft GitHub Release. Review the draft, then publish it.
name: Build

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to attach the installers to
        type: string
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write # create the draft release on tags

concurrency:
  group: build-${{ inputs.tag || github.ref }}
  # Superseded PR builds are cancelled; release builds always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal macOS app contains both architectures.
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Release builds attach to the tag's release; other runs just build.
          tagName: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          releaseName: Margin ${{ inputs.tag || github.ref_name }}
          releaseBody: Download the installer for your system below. See the README for details.
          releaseDraft: true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: margin-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
